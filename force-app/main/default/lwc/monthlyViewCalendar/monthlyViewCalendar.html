<template>
    <template if:false={isLoading}>
        <div class="monthly-view-panel">
            <template for:each={weekDaysNames} for:item="dayName">
                <h3 key={dayName} class="day-name-cell">{dayName}</h3>
            </template>
            <template for:each={currentMonthTiles} for:item="dateTile">
                <c-month-tile-calendar data-id={dateTile.key} data-date={dateTile.date} onclick={jumpToDaily} key={dateTile.dateString} month-tile-data={dateTile}></c-month-tile-calendar>
            </template>
        </div>
    </template>
    <template if:true={isLoading}>
        <div class="spinner-container">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>
</template>
